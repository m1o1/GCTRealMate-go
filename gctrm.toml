# GCTRealMate Go 0.14.0 configuration. Full guide: CONFIGURATION.md.
# Select explicitly: .\bin\gctrm.exe --config gctrm.toml source.asm
# Or copy beside the executable as <executable-basename>.toml.
# Every [bug_fixes] option defaults true; all other flags default false.
# Defaults include missing GameCube/Wii instructions and preserve other C++ choices.
# Examples assume all fixes enabled and other default settings unless noted.
# Source fragments belong in a named section/block unless the example says otherwise.
version = 2

[bug_fixes]
# Enable implemented GameCube/Wii instructions missing from the C++ reference.
# Example: mfsr r3,sr0 emits 7C6004A6 with true. With false and unknown_instructions=true,
# it is rejected; with both false, the characterized C++ fallback is retained.
# CLI/INI: --set=bug_fixes.additional_console_instructions=true|false
additional_console_instructions = true

# Encode algebraic halfword loads instead of zero-extending loads.
# Example: lha r3,0(r4): false emits A0640000; true emits A8640000.
# CLI/INI: --set=bug_fixes.lha=true|false
lha = true

# Use both supplied source registers instead of repeating the first.
# Example: eqv r3,r4,r5: false uses r4 twice; true uses r4 and r5.
# CLI/INI: --set=bug_fixes.eqv=true|false
eqv = true

# Encode CR AND-complement rather than CR AND.
# Example: crandc 1,2,3: false encodes crand; true complements the second source.
# CLI/INI: --set=bug_fixes.crandc=true|false
crandc = true

# Encode CR OR-complement rather than CR OR.
# Example: crorc 1,2,3: false encodes cror; true complements the second source.
# CLI/INI: --set=bug_fixes.crorc=true|false
crorc = true

# Set OE/Rc bits instead of adding decimal 400/401.
# Example: addo r3,r4,r5: false emits 7C642BA4; true emits 7C642E14.
# CLI/INI: --set=bug_fixes.overflow_suffix=true|false
overflow_suffix = true

# Prevent a zero-distance srwi from carrying into the destination field.
# Example: srwi r3,r4,0: false emits 5484003E; true emits 5483003E.
# CLI/INI: --set=bug_fixes.shift_right_zero=true|false
shift_right_zero = true

# Insert only the signed 12-bit quantized displacement.
# Example: psq_l f0,-8(r3),0,0: false borrows into base/W/I fields; true preserves those fields.
# CLI/INI: --set=bug_fixes.quantized_displacement=true|false
quantized_displacement = true

# Encode the existing indexed psq load/store forms and update selectors.
# Example: psq_lx f1,r3,r4,0,0: false reports a bounded failure; true assembles it.
# CLI/INI: --set=bug_fixes.indexed_quantized=true|false
indexed_quantized = true

# Honor supported paired-single record suffixes.
# Example: ps_add. f1,f2,f3: false ignores the dot; true sets Rc.
# CLI/INI: --set=bug_fixes.paired_single_record=true|false
paired_single_record = true

# Parse complete hexadecimal register and numeric fields instead of decimal prefixes.
# Example: cmpw r5,0xD: false selects register 0; true selects register 13.
# CLI/INI: --set=bug_fixes.numeric_fields=true|false
numeric_fields = true

# Correct generic comparison operand selection, cmpli routing, and comparison L encoding.
# Example: cmpli 0,0,r3,1: true compares r3 to immediate 1; false follows the incorrect
# register-comparison path. L=1 still requires console_only=false.
# CLI/INI: --set=bug_fixes.comparisons=true|false
comparisons = true

# Set the explicit BO prediction bit without carrying into another BO bit.
# Example: bc+ 13,2,0x10: false increments BO to 14; true keeps BO 13. The GNU hint convention
# is a separate option.
# CLI/INI: --set=bug_fixes.branch_prediction=true|false
branch_prediction = true

# Flush pending raw bytes at the end of input.
# Example: A final byte 0x12 is dropped with false and padded/emitted with true. Section
# transitions flush in either mode.
# CLI/INI: --set=bug_fixes.raw_data_eof=true|false
raw_data_eof = true

# Preserve multiplication operators in outer-scanned source.
# Example: A standalone .GR4 *= 00000002 loses its star with false; true emits the multiply
# operation. Inline op scanning is unchanged.
# CLI/INI: --set=bug_fixes.scanner_multiply=true|false
scanner_multiply = true

# Preserve OR operators in aliases and GR directives.
# Example: A standalone .GR4 |= 00000002 is treated as continuation with false; true emits the
# OR operation. With unknown_instructions=true, the truncated directive is rejected.
# CLI/INI: --set=bug_fixes.scanner_or=true|false
scanner_or = true

# Evaluate every alias term instead of losing later accumulator updates and partially parsing
# numbers.
# Example: .alias x = 2 + 3 + 4: false gives 5; true gives 9. Scanner fixes and expression
# extensions remain separate.
# CLI/INI: --set=bug_fixes.alias_terms=true|false
alias_terms = true

# Preserve the selected GR index in load/store directives.
# Example: .GR5 <-(16) $00001000: false omits index 5; true encodes GR5.
# CLI/INI: --set=bug_fixes.gr_index=true|false
gr_index = true

# Parse the supported BA/PO and GR qualifiers correctly.
# Example: .BA = PO+$1000: false reports a bounded failure; true assembles it.
# CLI/INI: --set=bug_fixes.address_qualifiers=true|false
address_qualifiers = true

# Preserve the high bit of BA/PO/GR directive values.
# Example: .PO = $90000000: false stores 10000000; true stores 90000000.
# CLI/INI: --set=bug_fixes.directive_bit31=true|false
directive_bit31 = true

# Split direct-write addresses into BA and the correct offset.
# Example: word 0x11223344 @ $90001000: false targets the wrong offset; true writes to 90001000.
# CLI/INI: --set=bug_fixes.mem2_writes=true|false
mem2_writes = true

# Use BA and the correct offset for MEM2 hooks.
# Example: HOOK @ $90001000 with a blr body: false sets PO with zero hook offset; true targets
# 90001000.
# CLI/INI: --set=bug_fixes.mem2_hooks=true|false
mem2_hooks = true

# Preserve bank/type tags in direct PSA writes.
# Example: RA_float 3 @ $80001000: false keeps only index 3; true preserves the RA/float tags.
# Block data is unchanged.
# CLI/INI: --set=bug_fixes.psa_tags=true|false
psa_tags = true

# Emit the second word of .GOTO_F commands.
# Example: .GOTO_F -> next emits a complete pair with true. False emits only its first word;
# other checks may reject the malformed result.
# CLI/INI: --set=bug_fixes.goto_false=true|false
goto_false = true

# Insert Gecko label offsets into the low field and check their range/alignment.
# Example: A backward .GOTO -> back preserves command bits with true; false can borrow into them.
# CLI/INI: --set=bug_fixes.gecko_label_offsets=true|false
gecko_label_offsets = true

# Emit the supported .ELSE and .ELSE_RESET commands.
# Example: .ELSE fails safely with false; .ELSE_RESET is omitted. True emits the appropriate
# pair for either form.
# CLI/INI: --set=bug_fixes.else_directives=true|false
else_directives = true

# Diagnose unresolved PPC and Gecko labels instead of retaining zero displacements.
# Example: b missing with no such label: false emits a zero-distance branch; true reports an error.
# CLI/INI: --set=bug_fixes.missing_labels=true|false
missing_labels = true

# Require recognized instruction names rather than reference prefix/fallback acceptance.
# Example: garbage r3,r4,r5: false emits FFFFFFFF; true reports an error. This also covers
# fmulls and unknown CR-like names.
# CLI/INI: --set=bug_fixes.unknown_instructions=true|false
unknown_instructions = true

# Reject extra machine-instruction operands instead of ignoring them.
# Example: add r3,r4,r5,r6: false ignores r6; true reports an error. Missing required operands
# always fail safely.
# CLI/INI: --set=bug_fixes.operand_counts=true|false
operand_counts = true

# Check encoded register/numeric field widths and immediate ranges.
# Example: add r32,r4,r5: false allows the field to overflow; true reports an error. Hex parsing
# is controlled by numeric_fields.
# CLI/INI: --set=bug_fixes.operand_ranges=true|false
operand_ranges = true

# Reject unsupported record/overflow suffixes.
# Example: addi. r3,r4,1: false ignores the dot; true reports an error. Legal OE and paired-
# single Rc encoding have separate fixes.
# CLI/INI: --set=bug_fixes.suffix_validation=true|false
suffix_validation = true

# Reject statically invalid memory-register combinations and CTR branch conditions.
# Example: lwzu r3,4(r3): false accepts overlapping registers; true rejects them. bcctr with a
# BO that tests/decrements CTR is also rejected.
# CLI/INI: --set=bug_fixes.register_relationships=true|false
register_relationships = true

# Reject PPC branch displacements that are unaligned or out of range.
# Example: b 0x2000000: false masks the displacement; true rejects it.
# CLI/INI: --set=bug_fixes.branch_ranges=true|false
branch_ranges = true

# Require word-aligned PPC write/block addresses.
# Example: op nop @ $80001001: false accepts it; true reports an alignment error.
# CLI/INI: --set=bug_fixes.address_alignment=true|false
address_alignment = true

# Check that PSA variable indices fit 24 bits.
# Example: RA_float 0x1000000 @ $80001000: false truncates the index; true rejects it.
# CLI/INI: --set=bug_fixes.psa_index_range=true|false
psa_index_range = true

# Reject sections with an incomplete eight-byte Gecko line.
# Example: With goto_false=false, a lone .GOTO_F can leave an odd word count: true rejects it;
# false permits that malformed framing.
# CLI/INI: --set=bug_fixes.gecko_line_framing=true|false
gecko_line_framing = true

# Encode DS-form offsets as aligned byte displacements rather than multiplying by four.
# Example: With console_only=false, ld r3,8(r4) emits E8640020 with false or E8640008 with true.
# Misaligned offsets are rejected with true.
# CLI/INI: --set=bug_fixes.ds_displacement=true|false
ds_displacement = true

# Return failure status for missing input/include files.
# Example: .include absent.asm produces no GCT either way: false returns status 0; true returns
# nonzero.
# CLI/INI: --set=bug_fixes.missing_file_status=true|false
missing_file_status = true

# Terminate a final odd word in text output before the section separator.
# Example: For a three-word section, false ends the last word with one newline; true adds its
# line terminator plus the blank separator. Such sections also require gecko_line_framing=false.
# CLI/INI: --set=bug_fixes.text_line_termination=true|false
text_line_termination = true

[extensions]
# Accept .op as an alias for op. False ignores .op lines like C++.
# Example: .op nop @ $80001000 is ignored with false; true emits a nop write.
# CLI/INI: --set=extensions.dot_op=true|false
dot_op = false

# Accept additional numeric branch forms.
# Example: with true, b 20 and b 16+4 encode the same target as b 0x14.
# With false, use b 0x14 or a defined label.
# CLI/INI: --set=extensions.branch_expressions=true|false
branch_expressions = false

# Accept expanded expressions beyond the reference grammar.
# Examples with true:
#   li r3,0b1010                loads 10 (binary literal).
#   li r3,(2+3)                 loads 5 (parentheses).
#   word 2+3                    emits 00000005 (arithmetic in data).
#   .alias mask = (1 << 4) - 1   evaluates to 15 (shift).
#   .alias mask = ~0             evaluates to 0xffffffff (32-bit complement).
# These added forms are rejected with false. Arithmetic width and precedence
# are controlled separately by the semantics settings below.
# CLI/INI: --set=extensions.expression_syntax=true|false
expression_syntax = false

# Allow source without an initial named section.
# Example: a file containing only op nop @ $80001000 fails with false;
# true creates a section named Codes and assembles the write.
# CLI/INI: --set=extensions.implicit_sections=true|false
implicit_sections = false

# Permit implemented PowerPC instructions that cannot run on GameCube/Wii.
# Example: ld r3,8(r4) and mulld r3,r4,r5 require true; false rejects them.
# This does not change their encoding fixes or add missing console instructions.
# CLI/INI: --set=extensions.non_console_instructions=true|false
non_console_instructions = false

[semantics]
# Interpret leading-zero integers as decimal instead of octal.
# Example: li r3,010 loads 8 with false or 10 with true.
# The literal 08 is invalid octal with false, but means 8 with true.
# CLI/INI: --set=semantics.decimal_leading_zeros=true|false
decimal_leading_zeros = false

# Use C-style operator precedence instead of left-to-right evaluation.
# Example: .alias x = 2 + 3 * 4 evaluates to 20 with false or 14 with true.
# CLI/INI: --set=semantics.c_operator_precedence=true|false
c_operator_precedence = false

# Use signed 64-bit aliases instead of unsigned 32-bit arithmetic.
# Example: .alias x = 0xffffffff + 1 evaluates to 0 with false (32-bit wrap)
# or 4294967296 with true. This affects assembler calculations, not CPU width.
# CLI/INI: --set=semantics.signed_64_bit_aliases=true|false
signed_64_bit_aliases = false

[encoding]
# Use GNU prediction-bit conventions instead of C++ conventions.
# Example: bdnz -0x10 emits 4220FFF0 with false or 4200FFF0 with true.
# Only the prediction bit changes; the branch condition and target are the same.
# CLI/INI: --set=encoding.gnu_branch_hints=true|false
gnu_branch_hints = false

# Sign-extend negative byte/half values occupying 32-bit slots.
# Example inside CODE: byte -1 emits 000000FF with false or FFFFFFFF with true;
# half -1 similarly emits 0000FFFF or FFFFFFFF. Packed arrays keep their widths.
# CLI/INI: --set=encoding.sign_extend_data_slots=true|false
sign_extend_data_slots = false

# Use the alternative quiet float NaN payload.
# Example: float NaN emits 7FFFFFFF with false or 7FC00000 with true.
# CLI/INI: --set=encoding.alternative_float_nan=true|false
alternative_float_nan = false

# Use the alternative quiet double NaN payload.
# Example: double NaN emits 7FFFFFFF FFFFFFFF with false
# or 7FF80000 00000001 with true. Each value occupies eight bytes.
# CLI/INI: --set=encoding.alternative_double_nan=true|false
alternative_double_nan = false

[validation]
# Require register prefixes to match their operand classes.
# Example: fadd r3,r4,r5 is accepted with false and rejected with true.
# The matching spelling fadd f3,f4,f5 works in both cases.
# CLI/INI: --set=validation.strict_register_prefixes=true|false
strict_register_prefixes = false

# Reject duplicate labels instead of using the first definition.
# Example: defining loop: twice in the same block keeps the first with false;
# true reports a duplicate-label error.
# CLI/INI: --set=validation.reject_duplicate_labels=true|false
reject_duplicate_labels = false

# Reject extra macro arguments and missing closing parentheses.
# Example: if Patch is declared with no parameters, %Patch(extra) ignores
# the extra argument with false; true reports an argument-count error.
# CLI/INI: --set=validation.strict_macro_calls=true|false
strict_macro_calls = false

# Reject undefined macros instead of expanding them to nothing.
# Example: %Missing() with no matching macro is ignored with false;
# true reports an undefined-macro error.
# CLI/INI: --set=validation.reject_undefined_macros=true|false
reject_undefined_macros = false

# Reject trailing annotations after source addresses.
# Example: op nop @ $80001000 note uses address 80001000 with false;
# true rejects the trailing note.
# CLI/INI: --set=validation.reject_address_annotations=true|false
reject_address_annotations = false

# Reject out-of-range integer data instead of truncating it.
# Example: byte 256 @ $80001000 writes zero with false;
# true reports that 256 does not fit in a byte.
# CLI/INI: --set=validation.reject_data_overflow=true|false
reject_data_overflow = false

[cli]
# Match INI basenames exactly instead of matching prefixes.
# Example: if patch.asm.backup : -g appears before patch.asm : -t in the INI,
# assembling patch.asm selects -g with false or -t with true.
# CLI/INI: --set=cli.exact_ini_matching=true|false
exact_ini_matching = false

# Write a flat code list instead of the include tree.
# Example: with -l and .include part.asm, false logs the include and nested
# sections; true lists only section names and offsets.
# CLI/INI: --set=cli.flat_logs=true|false
flat_logs = false

# Write LF on every host instead of native text newlines.
# Example: with -t or -l on Windows, false separates lines with \r\n;
# true uses \n. On Linux/macOS, both settings use \n.
# CLI/INI: --set=cli.lf_line_endings=true|false
lf_line_endings = false
