# GCTRealMate Go 0.16.0 configuration. Full guide: CONFIGURATION.md.
# Select explicitly: .\bin\gctrm.exe --config gctrm.toml source.asm
# Or copy beside the executable as <executable-basename>.toml.
# Every [bug_fixes] option defaults true; all other flags default false.
# Defaults include missing GameCube/Wii instructions and preserve other C++ choices.
# Examples assume all fixes enabled and other default settings unless noted.
# Source fragments belong in a named section/block unless the example says otherwise.
# Each Effect explains the example's consequence for values, control flow, input, or files.
# These are isolated encoding examples, not complete playable codesets. In-game effects
# depend on how the resulting code/data is used. An assembly error preserves existing outputs.
version = 2

[bug_fixes]
# Enable implemented GameCube/Wii instructions missing from the C++ reference.
# Example: mfsr r3,sr0 emits 7C6004A6 with true. With false and unknown_instructions=true,
# it is rejected; with both false, the characterized C++ fallback is retained.
# Effect: The valid instruction reads segment register sr0 into CPU register r3. Rejecting it
# stops the build; a fallback word does not reliably perform that read. Enabling support does not
# remove the instruction's CPU privilege requirements.
# CLI/INI: --set=bug_fixes.additional_console_instructions=true|false
additional_console_instructions = true

# Encode algebraic halfword loads instead of zero-extending loads.
# Example: lha r3,0(r4): false emits A0640000; true emits A8640000.
# Effect: If memory contains halfword FFFF, false loads r3 with 0000FFFF (65535), while true
# loads FFFFFFFF (-1 as a signed 32-bit value). Arithmetic and signed comparisons using the
# loaded value can therefore change.
# CLI/INI: --set=bug_fixes.lha=true|false
lha = true

# Use both supplied source registers instead of repeating the first.
# Example: eqv r3,r4,r5: false uses r4 twice; true uses r4 and r5.
# Effect: False computes NOT(r4 XOR r4), so r3 always becomes FFFFFFFF. True computes NOT(r4 XOR
# r5), producing a bit mask of positions where the two inputs agree. Code using that mask can
# behave differently.
# CLI/INI: --set=bug_fixes.eqv=true|false
eqv = true

# Encode CR AND-complement rather than CR AND.
# Example: crandc 1,2,3: false encodes crand; true complements the second source.
# Effect: With CR bit 2 = 1 and bit 3 = 0, false clears destination CR bit 1 while true sets it.
# A later branch testing that condition bit can take the opposite path.
# CLI/INI: --set=bug_fixes.crandc=true|false
crandc = true

# Encode CR OR-complement rather than CR OR.
# Example: crorc 1,2,3: false encodes cror; true complements the second source.
# Effect: With CR bits 2 and 3 both zero, false clears destination CR bit 1 while true sets it. A
# later branch testing that bit can take the opposite path.
# CLI/INI: --set=bug_fixes.crorc=true|false
crorc = true

# Set OE/Rc bits instead of adding decimal 400/401.
# Example: addo r3,r4,r5: false emits 7C642BA4; true emits 7C642E14.
# Effect: True emits addition with signed-overflow reporting in XER, so later overflow checks can
# observe it. False changes instruction bits incorrectly; its word is not simply an ordinary add
# with overflow reporting disabled.
# CLI/INI: --set=bug_fixes.overflow_suffix=true|false
overflow_suffix = true

# Prevent a zero-distance srwi from carrying into the destination field.
# Example: srwi r3,r4,0: false emits 5484003E; true emits 5483003E.
# Effect: A shift by zero should copy r4 to r3. False instead writes r4 back to r4 and leaves r3
# unchanged, so subsequent code may use a stale destination value.
# CLI/INI: --set=bug_fixes.shift_right_zero=true|false
shift_right_zero = true

# Insert only the signed 12-bit quantized displacement.
# Example: psq_l f0,-8(r3),0,0: false borrows into base/W/I fields; true preserves those fields.
# Effect: The intended load uses r3 minus 8 and the requested element-count/quantization
# settings. Corrupting neighboring fields can select a different base register or data
# interpretation, changing the address or floating values loaded.
# CLI/INI: --set=bug_fixes.quantized_displacement=true|false
quantized_displacement = true

# Encode the existing indexed psq load/store forms and update selectors.
# Example: psq_lx f1,r3,r4,0,0: false reports a bounded failure; true assembles it.
# Effect: True lets the requested indexed paired-single load run using the address formed from r3
# and r4 and the selected GQR format. False stops assembly for this example, so there is no
# successful equivalent output to compare.
# CLI/INI: --set=bug_fixes.indexed_quantized=true|false
indexed_quantized = true

# Honor supported paired-single record suffixes.
# Example: ps_add. f1,f2,f3: false ignores the dot; true sets Rc.
# Effect: True updates condition-register field CR1 from floating-point status as requested by
# the dot. False leaves CR1 unchanged even though the paired addition still runs; later CR1 tests
# can observe stale status. This is not an integer CR0 result comparison.
# CLI/INI: --set=bug_fixes.paired_single_record=true|false
paired_single_record = true

# Parse complete hexadecimal register and numeric fields instead of decimal prefixes.
# Example: cmpw r5,0xD: false selects register 0; true selects register 13.
# Effect: The example compares r5 against r0 with false or against r13 with true. Those registers
# can hold different values, changing the condition flags and subsequent branches; this is more
# than a register-spelling preference.
# CLI/INI: --set=bug_fixes.numeric_fields=true|false
numeric_fields = true

# Correct generic comparison operand selection, cmpli routing, and comparison L encoding.
# Example: cmpli 0,0,r3,1: true compares r3 to immediate 1; false follows the incorrect
# register-comparison path. L=1 still requires extensions.non_console_instructions=true.
# Effect: True tests r3 against the constant 1 and records the comparison in CR0. The wrong
# register-comparison path can test different operands, so following conditional branches may
# take the wrong path.
# CLI/INI: --set=bug_fixes.comparisons=true|false
comparisons = true

# Set the explicit BO prediction bit without carrying into another BO bit.
# Example: bc+ 13,2,0x10: false increments BO to 14; true keeps BO 13. The GNU hint convention
# is a separate option.
# Effect: In this specific BO=13 example, both encodings still test whether CR bit 2 is set, but
# false reverses the requested prediction hint and sets an ignored BO bit. For other BO values,
# the carry can reach bits controlling the branch condition or CTR test.
# CLI/INI: --set=bug_fixes.branch_prediction=true|false
branch_prediction = true

# Flush pending raw bytes at the end of input.
# Example: A final byte 0x12 is dropped with false and padded/emitted with true. Section
# transitions flush in either mode.
# Effect: True retains the final data instead of silently shortening the output. Zero padding
# fills the output word/line; it does not turn an isolated byte into a meaningful Gecko command.
# The surrounding data layout still determines how the bytes are used.
# CLI/INI: --set=bug_fixes.raw_data_eof=true|false
raw_data_eof = true

# Preserve multiplication operators in outer-scanned source.
# Example: A standalone .GR4 *= 00000002 loses its star with false; true emits the multiply
# operation. Inline op scanning is unchanged.
# Effect: If Gecko register GR4 initially holds 3, true makes it 6; false assigns 2 because the
# multiplication operator was lost. Later handler operations using GR4 can therefore use a
# different value or address.
# CLI/INI: --set=bug_fixes.scanner_multiply=true|false
scanner_multiply = true

# Preserve OR operators in aliases and GR directives.
# Example: A standalone .GR4 |= 00000002 is treated as continuation with false; true emits the
# OR operation. With unknown_instructions=true, the truncated directive is rejected.
# Effect: True sets bit 1 of Gecko register GR4 while preserving its other bits; an initial value
# 1 becomes 3. Losing the operator can omit that update or cause a diagnostic, rather than
# performing the requested bit-mask operation.
# CLI/INI: --set=bug_fixes.scanner_or=true|false
scanner_or = true

# Evaluate every alias term instead of losing later accumulator updates and partially parsing
# numbers.
# Example: .alias x = 2 + 3 + 4: false gives 5; true gives 9. Scanner fixes and expression
# extensions remain separate.
# Effect: An instruction such as li r3,x loads 5 with false or 9 with true. Every use of the
# alias can affect emitted immediates, data, or addresses; the calculation happens during
# assembly.
# CLI/INI: --set=bug_fixes.alias_terms=true|false
alias_terms = true

# Preserve the selected GR index in load/store directives.
# Example: .GR5 <-(16) $00001000: false omits index 5; true encodes GR5.
# Effect: False updates Gecko register GR0 instead of GR5; later commands using GR5 can see its
# previous value. These are registers maintained by the Gecko handler, not the CPU's r0 and r5.
# CLI/INI: --set=bug_fixes.gr_index=true|false
gr_index = true

# Parse the supported BA/PO and GR qualifiers correctly.
# Example: .BA = PO+$1000: false reports a bounded failure; true assembles it.
# Effect: True allows the requested PO-relative base-address update to be emitted, so later
# BA-relative commands can use it. False stops assembly here; it does not provide a different
# successful implementation of that update.
# CLI/INI: --set=bug_fixes.address_qualifiers=true|false
address_qualifiers = true

# Preserve the high bit of BA/PO/GR directive values.
# Example: .PO = $90000000: false stores 10000000; true stores 90000000.
# Effect: The handler receives a different pointer value: 10000000 instead of 90000000. Later
# PO-relative accesses can resolve differently. Whether a particular change affects gameplay
# depends on the handler and memory mapping; preserving an address bit is not itself a gameplay
# test.
# CLI/INI: --set=bug_fixes.directive_bit31=true|false
directive_bit31 = true

# Split direct-write addresses into BA and the correct offset.
# Example: word 0x11223344 @ $90001000: false targets the wrong offset; true writes to 90001000.
# Effect: The value 11223344 is unchanged, but the fields locating its destination differ. True
# places the MEM2 address bits where the handler expects them; the defective split can patch a
# different location.
# CLI/INI: --set=bug_fixes.mem2_writes=true|false
mem2_writes = true

# Use BA and the correct offset for MEM2 hooks.
# Example: HOOK @ $90001000 with a blr body: false sets PO with zero hook offset; true targets
# 90001000.
# Effect: A hook must replace the instruction at the intended address and return from its
# payload. Correcting the base/offset makes this hook target 90001000; the wrong fields can leave
# the intended code unhooked or alter another location.
# CLI/INI: --set=bug_fixes.mem2_hooks=true|false
mem2_hooks = true

# Preserve bank/type tags in direct PSA writes.
# Example: RA_float 3 @ $80001000: false keeps only index 3; true preserves the RA/float tags.
# Block data is unchanged.
# Effect: The stored value identifies a PSA variable, rather than being the IEEE floating-point
# value 3.0. Losing its RA/float tags can make the PSA interpreter resolve the wrong variable
# bank or type even though index 3 survives.
# CLI/INI: --set=bug_fixes.psa_tags=true|false
psa_tags = true

# Emit the second word of .GOTO_F commands.
# Example: .GOTO_F -> next emits a complete pair with true. False emits only its first word;
# other checks may reject the malformed result.
# Effect: With the second word missing, the following command's first word can be consumed as
# part of the GOTO command, disrupting the rest of the stream. True preserves command boundaries
# and the intended conditional jump.
# CLI/INI: --set=bug_fixes.goto_false=true|false
goto_false = true

# Insert Gecko label offsets into the low field and check their range/alignment.
# Example: A backward .GOTO -> back preserves command bits with true; false can borrow into them.
# Effect: A backward jump must change only its displacement field. Borrowing into command bits
# can change the handler operation as well as its destination; true preserves the requested jump
# command.
# CLI/INI: --set=bug_fixes.gecko_label_offsets=true|false
gecko_label_offsets = true

# Emit the supported .ELSE and .ELSE_RESET commands.
# Example: .ELSE fails safely with false; .ELSE_RESET is omitted. True emits the appropriate
# pair for either form.
# Effect: True emits the conditional-control commands needed for the alternate path. Omitting
# .ELSE_RESET can leave later commands under the previous execution state; a rejected .ELSE
# produces no new successful build.
# CLI/INI: --set=bug_fixes.else_directives=true|false
else_directives = true

# Diagnose unresolved PPC and Gecko labels instead of retaining zero displacements.
# Example: b missing with no such label: false emits a zero-distance branch; true reports an error.
# Effect: In this example, a zero-distance unconditional branch jumps to itself and can loop
# indefinitely when executed. True exposes the missing destination at assembly time instead of
# leaving that instruction in the output.
# CLI/INI: --set=bug_fixes.missing_labels=true|false
missing_labels = true

# Require recognized instruction names rather than reference prefix/fallback acceptance.
# Example: garbage r3,r4,r5: false emits FFFFFFFF; true reports an error. This also covers
# fmulls and unknown CR-like names.
# Effect: False can produce a file containing a fallback word or an unrelated prefix-matched
# instruction for a typo. True requires the mnemonic to be corrected before output is generated;
# successful assembly alone is not proof that a fallback performs the intended operation.
# CLI/INI: --set=bug_fixes.unknown_instructions=true|false
unknown_instructions = true

# Reject extra machine-instruction operands instead of ignoring them.
# Example: add r3,r4,r5,r6: false ignores r6; true reports an error. Missing required operands
# always fail safely.
# Effect: False still computes r3 = r4 + r5; r6 has no role despite appearing in the source. True
# catches the extra operand so it cannot be mistaken for part of the calculation.
# CLI/INI: --set=bug_fixes.operand_counts=true|false
operand_counts = true

# Check encoded register/numeric field widths and immediate ranges.
# Example: add r32,r4,r5: false allows the field to overflow; true reports an error. Hex parsing
# is controlled by numeric_fields.
# Effect: The CPU has no GPR r32. An overflowing register field can spill into neighboring
# instruction bits instead of naming an extra register. True rejects that input before it
# produces a misleading instruction word.
# CLI/INI: --set=bug_fixes.operand_ranges=true|false
operand_ranges = true

# Reject unsupported record/overflow suffixes.
# Example: addi. r3,r4,1: false ignores the dot; true reports an error. Legal OE and paired-
# single Rc encoding have separate fixes.
# Effect: With false, the addi result is computed but CR0 is not updated, so a following branch
# can read old condition flags. True catches the unsupported dot; it does not silently substitute
# a different instruction.
# CLI/INI: --set=bug_fixes.suffix_validation=true|false
suffix_validation = true

# Reject statically invalid memory-register combinations and CTR branch conditions.
# Example: lwzu r3,4(r3): false accepts overlapping registers; true rejects them. bcctr with a
# BO that tests/decrements CTR is also rejected.
# Effect: The example asks r3 to receive both the loaded value and the updated base address, an
# invalid update-load register combination on the console. True rejects that form rather than
# promising a defined choice of final register value.
# CLI/INI: --set=bug_fixes.register_relationships=true|false
register_relationships = true

# Reject PPC branch displacements that are unaligned or out of range.
# Example: b 0x2000000: false masks the displacement; true rejects it.
# Effect: The masked field in this example encodes -0x2000000, so the CPU would branch 32 MiB
# backward instead of 32 MiB forward. True reports that the requested displacement cannot fit.
# CLI/INI: --set=bug_fixes.branch_ranges=true|false
branch_ranges = true

# Require word-aligned PPC write/block addresses.
# Example: op nop @ $80001001: false accepts it; true reports an alignment error.
# Effect: CPU instructions start on four-byte boundaries. Allowing this write places it one byte
# past such a boundary, so the patch does not line up with an instruction word. True catches that
# address mistake during assembly.
# CLI/INI: --set=bug_fixes.address_alignment=true|false
address_alignment = true

# Check that PSA variable indices fit 24 bits.
# Example: RA_float 0x1000000 @ $80001000: false truncates the index; true rejects it.
# Effect: Truncating 0x1000000 to 24 bits produces index 0, potentially selecting a different PSA
# variable. True requires an index that can be represented instead of silently redirecting the
# reference.
# CLI/INI: --set=bug_fixes.psa_index_range=true|false
psa_index_range = true

# Reject sections with an incomplete eight-byte Gecko line.
# Example: With goto_false=false, a lone .GOTO_F can leave an odd word count: true rejects it;
# false permits that malformed framing.
# Effect: A malformed line can cause the handler to pair words from different commands. True
# catches the incomplete framing before the file is written; it checks structure, not whether
# each otherwise complete command is meaningful.
# CLI/INI: --set=bug_fixes.gecko_line_framing=true|false
gecko_line_framing = true

# Encode DS-form offsets as aligned byte displacements rather than multiplying by four.
# Example: With extensions.non_console_instructions=true, ld r3,8(r4) emits E8640020 with false or E8640008 with true.
# Misaligned offsets are rejected with true.
# Effect: On a CPU supporting ld, false loads from r4+32 instead of r4+8. True fixes that byte
# offset. Neither setting makes ld executable on GameCube/Wii; this example requires the separate
# non-console instruction extension.
# CLI/INI: --set=bug_fixes.ds_displacement=true|false
ds_displacement = true

# Return failure status for missing input/include files.
# Example: .include absent.asm produces no GCT either way: false returns status 0; true returns
# nonzero.
# Effect: True lets scripts and build systems detect the failed assembly and stop. A zero exit
# status with false can make a later step continue with a missing file or reuse an older output,
# even though no new GCT was produced.
# CLI/INI: --set=bug_fixes.missing_file_status=true|false
missing_file_status = true

# Terminate a final odd word in text output before the section separator.
# Example: For a three-word section, false ends the last word with one newline; true adds its
# line terminator plus the blank separator. Such sections also require gecko_line_framing=false.
# Effect: True preserves the blank separator expected between named sections in codeset text.
# This can matter to text parsers and diffs; it does not repair the odd binary word count or
# change GCT bytes.
# CLI/INI: --set=bug_fixes.text_line_termination=true|false
text_line_termination = true

[extensions]
# Accept .op as an alias for op. False ignores .op lines like C++.
# Example: .op nop @ $80001000 is ignored with false; true emits a nop write.
# Effect: True emits a patch replacing the instruction at 80001000 with a no-operation
# instruction. False emits nothing for that line, leaving that location unpatched by it. Enabling
# the alias can therefore activate previously ignored code changes.
# CLI/INI: --set=extensions.dot_op=true|false
dot_op = false

# Accept additional numeric branch forms.
# Example: with true, b 20 and b 16+4 encode the same target as b 0x14.
# With false, use b 0x14 or a defined label.
# Effect: With numeric interpretation, each shown form requests a jump 20 bytes forward. This
# adds ways to write the same displacement, not a new CPU branch operation; using an equivalent
# accepted spelling produces the same instruction.
# CLI/INI: --set=extensions.branch_expressions=true|false
branch_expressions = false

# Accept expanded expressions beyond the reference grammar.
# Examples with true:
#   li r3,0b1010                loads 10 (binary literal).
#   li r3,(2+3)                 loads 5 (parentheses).
#   word (2+3)                  emits 00000005 (parenthesized block data).
#   .alias mask = (1 << 4) - 1   evaluates to 15 (shift).
#   .alias mask = ~0             evaluates to 0xffffffff (32-bit complement).
# These added forms are rejected with false. Arithmetic width and precedence
# are controlled separately by the semantics settings below.
# Existing block operands such as word 2+3 and word Alias+0x60 work with false.
# Standalone/addressed data and array counts retain their separate literal grammar.
# Effect: The li examples load the same values as li r3,10 and li r3,5; the word example embeds
# the value 5 as data. The mask examples produce the low four bits set (15) or all 32 bits set
# (FFFFFFFF). These are assembly-time calculations, not extra instructions evaluated by the CPU.
# Enabling syntax does not by itself change the separate arithmetic-width or precedence choices.
# CLI/INI: --set=extensions.expression_syntax=true|false
expression_syntax = false

# Accept float/double literals and arrays as data inside CODE/HOOK/PULSE blocks,
# and four-byte float data in op writes. This does not add CPU instructions.
# Example inside CODE: float NaN emits 7FFFFFFF with true (or 7FC00000 when
# encoding.alternative_float_nan=true); double 1.0 emits 3FF00000 00000000.
# With false and bug_fixes.unknown_instructions=true these forms are diagnosed.
# With both false, preserve the packaged instruction-parser fallback instead:
# float emits FC000000; double emits one word FFFFFFFF, regardless of NaN options.
# Ordinary float NaN @ $80001000 and double 1.0 @ $80001000 need no extension.
# op double still fails with true because op requires exactly four data bytes.
# Effect: True embeds actual four-byte float or eight-byte double data, so later labels can move
# when the data size changes. Those bytes are data, not an instruction that performs
# floating-point arithmetic. With both controls false, the fallback words are not equivalent
# numeric values. Ordinary addressed data writes keep their existing meaning regardless of this
# extension.
# CLI/INI: --set=extensions.floating_point_data=true|false
floating_point_data = false

# Allow source without an initial named section.
# Example: a file containing only op nop @ $80001000 fails with false;
# true creates a section named Codes and assembles the write.
# Effect: True lets an otherwise sectionless file assemble and supplies the name Codes for
# text/log output. For a file already containing a section name, this choice does not change its
# emitted instructions or data.
# CLI/INI: --set=extensions.implicit_sections=true|false
implicit_sections = false

# Permit implemented PowerPC instructions that cannot run on GameCube/Wii.
# Example: ld r3,8(r4) and mulld r3,r4,r5 require true; false rejects them.
# This does not change their encoding fixes or add missing console instructions.
# Effect: True only relaxes the assembler's target filter; it neither emulates these operations
# nor translates them into console instructions. A generated file containing ld or mulld still
# cannot use those instructions as GameCube/Wii CPU operations.
# CLI/INI: --set=extensions.non_console_instructions=true|false
non_console_instructions = false

[semantics]
# Leading-zero integer literals are always octal: 010 means 8; 08 is invalid.
# This is fixed syntax, not a configuration option.

# Use C-style operator precedence instead of left-to-right evaluation.
# Example: .alias x = 2 + 3 * 4 evaluates to 20 with false or 14 with true.
# Effect: A later li r3,x loads 20 with false or 14 with true. The same source can therefore emit
# different constants, addresses, or data; this is an assembler language choice, not a difference
# in how the CPU executes an already assembled instruction.
# CLI/INI: --set=semantics.c_operator_precedence=true|false
c_operator_precedence = false

# Use signed 64-bit aliases instead of unsigned 32-bit arithmetic.
# Example: .alias x = 0xffffffff + 1 evaluates to 0 with false (32-bit wrap)
# or 4294967296 with true. This affects assembler calculations, not CPU width.
# Effect: After the example, .alias y = x / 2 evaluates to 0 with false or 2147483648 with true.
# Using an unwrapped value in a narrower output field may instead produce a range error. This
# changes intermediate calculations and does not add 64-bit integer registers or instructions to
# the console.
# CLI/INI: --set=semantics.signed_64_bit_aliases=true|false
signed_64_bit_aliases = false

[encoding]
# Use GNU prediction-bit conventions instead of C++ conventions.
# Example: bdnz -0x10 emits 4220FFF0 with false or 4200FFF0 with true.
# Only the prediction bit changes; the branch condition and target are the same.
# Effect: Both instructions decrement CTR and branch to the same address when the count is
# nonzero. Their static prediction hint differs, which can affect timing if the CPU uses it;
# dynamic prediction can take precedence. Neither convention guarantees faster code or changes
# the branch's logical result.
# CLI/INI: --set=encoding.gnu_branch_hints=true|false
gnu_branch_hints = false

# Sign-extend negative byte/half values occupying 32-bit slots.
# Example inside CODE: byte -1 emits 000000FF with false or FFFFFFFF with true;
# half -1 similarly emits 0000FFFF or FFFFFFFF. Packed arrays keep their widths.
# Effect: A signed 32-bit consumer sees 255/65535 with false or -1 with true, so arithmetic and
# comparisons can change. A consumer reading only the low byte/half sees the same low bits.
# Packed arrays do not gain extra sign-extension bytes.
# CLI/INI: --set=encoding.sign_extend_data_slots=true|false
sign_extend_data_slots = false

# Use the alternative quiet float NaN payload.
# Example: float NaN @ $80001000 writes 7FFFFFFF with false or 7FC00000 with true.
# Effect: Both patterns are quiet NaNs, so they still represent a nonnumeric floating-point
# value. Bitwise comparisons, hashes, serialized data, or code expecting a particular NaN
# sentinel can distinguish them. This setting chooses stored bits; it does not configure the
# CPU's floating-point exception mode.
# CLI/INI: --set=encoding.alternative_float_nan=true|false
alternative_float_nan = false

# Use the alternative quiet double NaN payload.
# Example: double NaN @ $80001000 writes 7FFFFFFF FFFFFFFF with false
# or 7FF80000 00000001 with true. Each value occupies eight bytes.
# Effect: Both eight-byte patterns are quiet NaNs, but exact byte comparisons or NaN-payload
# checks can differ. Double-precision data is supported by the console FPU; selecting its
# representation does not enable 64-bit integer instructions.
# CLI/INI: --set=encoding.alternative_double_nan=true|false
alternative_double_nan = false

[validation]
# Require register prefixes to match their operand classes.
# Example: fadd r3,r4,r5 is accepted with false and rejected with true.
# The matching spelling fadd f3,f4,f5 works in both cases.
# Effect: Even when spelled with r prefixes, fadd operates on floating-point registers f3, f4 and
# f5, not the integer GPRs. True catches that misleading spelling. Correcting the prefixes to f
# changes source clarity, not the encoded instruction.
# CLI/INI: --set=validation.strict_register_prefixes=true|false
strict_register_prefixes = false

# Reject duplicate labels instead of using the first definition.
# Example: defining loop: twice in the same block keeps the first with false;
# true reports a duplicate-label error.
# Effect: With false, references resolve to the first loop definition, not the nearest or most
# recent one. True catches a possible wrong branch destination; uniquely named labels produce the
# same output either way.
# CLI/INI: --set=validation.reject_duplicate_labels=true|false
reject_duplicate_labels = false

# Reject extra macro arguments and missing closing parentheses.
# Example: if Patch is declared with no parameters, %Patch(extra) ignores
# the extra argument with false; true reports an argument-count error.
# Effect: The ignored argument contributes no value or generated code to Patch. True catches a
# call that may have been written for a different macro signature. Already well-formed calls with
# the correct arguments expand identically.
# CLI/INI: --set=validation.strict_macro_calls=true|false
strict_macro_calls = false

# Reject undefined macros instead of expanding them to nothing.
# Example: %Missing() with no matching macro is ignored with false;
# true reports an undefined-macro error.
# Effect: False emits no instructions or writes for the missing call, which can silently omit an
# intended patch. True stops assembly and identifies the missing macro so the omission is
# visible.
# CLI/INI: --set=validation.reject_undefined_macros=true|false
reject_undefined_macros = false

# Reject trailing annotations after source addresses.
# Example: op nop @ $80001000 note uses address 80001000 with false;
# true rejects the trailing note.
# Effect: False ignores note and emits the write at 80001000. True makes ambiguous trailing text
# an error. If it is only commentary, writing # note preserves the intended write while
# satisfying the stricter parser.
# CLI/INI: --set=validation.reject_address_annotations=true|false
reject_address_annotations = false

# Reject out-of-range integer data instead of truncating it.
# Example: byte 256 @ $80001000 writes zero with false;
# true reports that 256 does not fit in a byte.
# Effect: Eight bits cannot hold 256, and truncation changes the stored value to zero. That can
# turn a nonzero flag/count into zero rather than preserving the requested value. True requires a
# representable value or an appropriately wider data declaration.
# CLI/INI: --set=validation.reject_data_overflow=true|false
reject_data_overflow = false

[cli]
# Match INI basenames exactly instead of matching prefixes.
# Example: if patch.asm.backup : -g appears before patch.asm : -t in the INI,
# assembling patch.asm selects -g with false or -t with true.
# Effect: In this example, -g adds an RSBE01 header and asterisks to codeset text, while -t
# writes plain codeset text; GCT bytes are unchanged. Other selected INI options, such as base
# addresses or fix settings, can change GCT bytes, so choosing the wrong entry can affect more
# than formatting.
# CLI/INI: --set=cli.exact_ini_matching=true|false
exact_ini_matching = false

# Write a flat code list instead of the include tree.
# Example: with -l and .include part.asm, false logs the include and nested
# sections; true lists only section names and offsets.
# Effect: The default log helps trace sections back through included files; the flat log gives a
# simpler section/offset list. Only the log representation changes, not codeset text, GCT bytes,
# or runtime behavior. This flag alone does not request a log.
# CLI/INI: --set=cli.flat_logs=true|false
flat_logs = false

# Write LF on every host instead of native text newlines.
# Example: with -t or -l on Windows, false separates lines with \r\n;
# true uses \n. On Linux/macOS, both settings use \n.
# Effect: LF-only text can make cross-platform diffs stable, while a consumer expecting CRLF may
# prefer the Windows default. Text/log byte hashes can change, but binary GCT output and the
# instructions it contains do not.
# CLI/INI: --set=cli.lf_line_endings=true|false
lf_line_endings = false
